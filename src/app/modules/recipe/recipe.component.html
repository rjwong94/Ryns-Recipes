<h1>Recipe</h1>

<div ngbAccordion [closeOthers]="true" *ngFor="let recipe of recipes" class="recipe-list-nav">
  <div ngbAccordionItem [collapsed]="true">
    <h2 ngbAccordionHeader >
      <button ngbAccordionButton>{{recipe.name}}</button>
    </h2>
    <div ngbAccordionCollapse>
      <div ngbAccordionBody>
        <ng-template>
          {{recipe.ingredients}}
          {{recipe.steps}}
        </ng-template>
      </div>
    </div>
  </div>
</div>

<ng-container *ngIf="selectedRecipeId > -1">
  <app-recipe-details [id]="selectedRecipeId"></app-recipe-details>
</ng-container>
