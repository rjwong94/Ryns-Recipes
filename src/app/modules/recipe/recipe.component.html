<h1>Recipe</h1>

<div ngbAccordion [closeOthers]="true" class="recipe-list-nav">
  @for (recipe of recipes; track recipe) {
  <div ngbAccordionItem [collapsed]="recipe.id !== 0">
    <h2 ngbAccordionHeader>
      <button ngbAccordionButton>{{recipe.name}}</button>
    </h2>
    <div ngbAccordionCollapse>
      <div ngbAccordionBody>
        <ng-template>
          <h2>Ingredients</h2>
          <div *ngFor="let ingredients of recipe.ingredients">
            <ng-template *ngIf="(getIngredient(ingredients.ingredientId) | async) as ingredient">
              {{ingredients.amount}} {{ingredients.unit}} {{ingredient.name}}
            </ng-template>
          </div>
          <h2>Steps</h2>
          <ul>
            <li *ngFor="let step of recipe.steps; let i = index">{{i + 1}}. {{step}}</li>
          </ul>
        </ng-template>
      </div>
    </div>
  </div>
  }
</div>
