<h1>Ingredients</h1>

<h2>Category</h2>

<form [formGroup]="categoryForm">
  <fieldset>
    <div class="category-dropdown">
      <label for="category">Category: </label>
      <!-- <select formControlName="categoryId" name="categorySelect">
        <option 
        value="" 
        disabled 
        selected>Select the ingredient category
      </option>

        <option *ngFor="let category of (category$ | async)" [ngValue]="category.id">
          {{category.name}}
        </option>
      </select> -->
      <div ngbDropdown  formControlName="categoryId" name="categorySelect" class="d-inline-block">
        <button class="btn btn-outline-primary" id="dropdownBasic1" ngbDropdownToggle>Category</button>
        <div ngbDropdownMenu aria-labelledby="dropdownBasic1">
          <button ngbDropdownItem *ngFor="let category of (category$ | async)" [value]="category.id">
            {{category.name}}
          </button>
        </div>
      </div>

      <div class="subcategory-dropdown">
        <label for="subcategory">Sub Category: </label>
        <select formControlName="subCategoryId" name="subCategorySelect">
          <option disabled selected>Select the ingredient category
          </option>

          <option *ngFor="let subcategory of (subcategory$ | async)" [ngValue]="subcategory.id">
            {{subcategory.name}}
          </option>
        </select>
      </div>

      <div class="ingredients-list">
        <label for="ingredients">Ingredients: </label>
        <ng-container *ngFor="let ingredient of (ingredients$ | async)">
          <ul>{{ingredient.name}}</ul>
        </ng-container>
      </div>
    </div>
  </fieldset>
</form>
